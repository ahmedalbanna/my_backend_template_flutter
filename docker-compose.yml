version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: "file:/app/prisma/dev.db"
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-string-min-16-chars}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change-me-to-another-long-random-string-min-16-chars}"
    volumes:
      - sqlite_data:/app/prisma

volumes:
  sqlite_data:
